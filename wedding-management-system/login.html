<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedora | Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link href="css/wedora.css" rel="stylesheet">
</head>
<body>
    <main class="records">

        <div class="topbar">
            <span class="brand-mark"><span class="script-cap">W</span>EDORA</span>
            <div class="session-info"><a class="link-btn" href="register.html">Register</a></div>
        </div>

        <header class="rec-header">
            <div class="lotus" id="lotus" style="margin:0 auto 14px"></div>
            <div class="event-line">Welcome back</div>
            <h1>Sign In</h1>
            <div class="table-name">to plan your celebration</div>
        </header>

        <div class="panel">
            <div id="msg"></div>
            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password">
                </div>
                <button type="submit" class="btn-line solid" id="loginBtn" style="width:100%">Sign in</button>
            </form>
            <p style="font-size:16px;margin:18px 0 0">New couple? <a href="register.html">Create an account</a></p>

            <div class="demo-note">
                <span>Demo accounts</span>
                Admin &nbsp;·&nbsp; admin@wedding.com &nbsp;/&nbsp; Admin@123<br>
                Couple &nbsp;·&nbsp; priya@example.com &nbsp;/&nbsp; Test@123
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/icons.js"></script>
    <script>
        document.getElementById('lotus').innerHTML = ICONS.lotus;

        function notice(text, type = 'error') {
            document.getElementById('msg').innerHTML = `<div class="notice ${type}">${esc(text)}</div>`;
        }

        // Admins go to Reports, couples to their Dashboard
        async function goToDashboard() {
            const role = await getRole();
            location.href = role === 'admin' ? 'reports.html' : 'customer-dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) { notice('Please enter both email and password.'); return; }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.textContent = 'Signing in…';

            // Supabase Auth checks the email and the hashed password stored in auth.users
            const { error } = await db.auth.signInWithPassword({ email, password });
            if (error) {
                notice(friendlyError(error));
                btn.disabled = false; btn.textContent = 'Sign in';
                return;
            }
            await goToDashboard();
        });

        // already signed in? skip the form
        getCurrentUser().then(user => { if (user) goToDashboard(); });
    </script>
</body>
</html>
