<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Wedding Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav id="navbar"></nav>

<main>
  <div class="container">
    <div class="auth-wrap">
      <div class="card-soft auth-card">
        <h2 class="mb-1">Welcome back</h2>
        <p class="text-muted mb-4">Log in to manage your wedding.</p>

        <div id="msg"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Your password" required>
          </div>
          <button type="submit" class="btn btn-maroon w-100 py-2" id="loginBtn">Log in</button>
        </form>

        <p class="text-center mt-3 mb-0 small">
          New here? <a href="register.html">Create an account</a>
        </p>

        <div class="demo-box p-3 mt-4">
          <b>Demo accounts</b> (after loading sample data)<br>
          Admin: admin@wedding.com &nbsp;/&nbsp; Admin@123<br>
          Customer: priya@example.com &nbsp;/&nbsp; Test@123
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
    // Send the user to the right dashboard for their role
    async function goToDashboard() {
        const role = await getRole();
        location.href = role === 'admin' ? 'admin/dashboard.html' : 'customer-dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        // Simple validation before calling Supabase
        if (!email || !password) { showMessage('msg', 'Please enter both email and password.'); return; }

        const btn = document.getElementById('loginBtn');
        btn.disabled = true; btn.textContent = 'Logging in...';

        // Supabase Auth checks the email + hashed password stored in auth.users
        const { error } = await db.auth.signInWithPassword({ email, password });

        if (error) {
            showMessage('msg', friendlyError(error));
            btn.disabled = false; btn.textContent = 'Log in';
            return;
        }
        await goToDashboard();
    });

    async function init() {
        // Already logged in? Skip the form.
        if (await getCurrentUser()) { await goToDashboard(); return; }
        renderNavbar('login');
    }
    init();
</script>
</body>
</html>
