<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedora | My Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link href="css/wedora.css" rel="stylesheet">
</head>
<body>
    <main class="records">

        <div class="topbar">
            <a class="back-link" href="index.html"><span id="backIcon"></span>Timeline</a>
            <div class="session-info" id="sessionInfo"></div>
        </div>

        <header class="rec-header">
            <div class="lotus" id="lotus" style="margin:0 auto 14px"></div>
            <div class="event-line">Your Wedora</div>
            <h1 id="greeting">Dashboard</h1>
            <div class="table-name">your celebration at a glance</div>
        </header>
        <hr class="hairline">

        <section id="content"><p class="state">Loading&hellip;</p></section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/events.js"></script>
    <script>
        document.getElementById('backIcon').innerHTML = ICONS.back;
        document.getElementById('lotus').innerHTML = ICONS.lotus;

        const sum = (rows, field) => rows.reduce((t, r) => t + Number(r[field] || 0), 0);
        const tile = (label, value, note = '') =>
            `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div>
             ${note ? `<div class="stat-note">${note}</div>` : ''}</div>`;

        function renderSession(customer) {
            document.getElementById('sessionInfo').innerHTML = `${esc(customer.email)}
                <a class="link-btn" href="event.html?e=reception" style="margin-left:10px">Profile</a>
                <button class="link-btn" id="signOutBtn" style="margin-left:10px">Sign out</button>`;
            document.getElementById('signOutBtn').onclick = async () => {
                await db.auth.signOut();
                location.href = 'index.html';
            };
        }

        async function loadDashboard(customer) {
            document.getElementById('greeting').textContent = `Hello, ${customer.full_name.split(' ')[0]}`;

            // RLS returns only THIS customer's weddings and bookings
            const [wed, bks] = await Promise.all([
                db.from('wedding')
                  .select('wedding_id, bride_name, groom_name, wedding_date, guest_count, status, venue(venue_name, city)')
                  .order('wedding_date'),
                db.from('booking_summary').select('*').order('booking_date', { ascending: false }),
            ]);
            const content = document.getElementById('content');
            if (wed.error || bks.error) {
                content.innerHTML = `<p class="state error">${esc(friendlyError(wed.error || bks.error))}</p>`;
                return;
            }
            const weddings = wed.data, bookings = bks.data;
            const active = bookings.filter(b => b.booking_status !== 'Cancelled');   // cancelled ones are not counted

            // ---- next upcoming wedding ----
            const today = todayISO();
            const next = weddings.find(w => w.wedding_date >= today && w.status !== 'Cancelled');
            let upcoming;
            if (next) {
                const days = Math.round((new Date(next.wedding_date) - new Date(today)) / 86400000);
                upcoming = `
                    <p class="countdown">${days === 0 ? 'Today!' : `${days} days to go`}</p>
                    <h3 class="couple">${esc(next.bride_name)} &amp; ${esc(next.groom_name)}</h3>
                    <p class="detail">${formatDate(next.wedding_date)} &middot; <span class="status ${esc(next.status)}">${esc(next.status)}</span></p>
                    <p class="detail">${next.venue ? esc(next.venue.venue_name + ', ' + next.venue.city) : '<em>Venue not chosen yet</em>'}</p>
                    <p class="detail">${next.guest_count} guests</p>
                    <a class="btn-line small" href="event.html?e=muhurtham">Open my weddings</a>`;
            } else {
                upcoming = `<p class="state" style="padding:20px 0">No upcoming weddings yet.</p>
                    <a class="btn-line small" href="event.html?e=muhurtham">+ Create a wedding</a>`;
            }

            // ---- plan by ceremony (links into the timeline pages) ----
            const ceremonies = EVENTS.map(ev => `
                <a class="ceremony-link" href="event.html?e=${ev.key}">
                    <span class="mini-icon">${ICONS[ev.icon]}</span>
                    <span><span class="name">${ev.title}</span><span class="sub">${ev.pageTitle}</span></span>
                </a>`).join('');

            // ---- recent bookings ----
            const recent = bookings.slice(0, 6);
            const bookingTable = recent.length ? `
                <div class="table-wrap"><table class="data">
                  <thead><tr><th>Vendor</th><th>Service date</th><th class="num">Amount</th><th class="num">Balance</th><th>Status</th></tr></thead>
                  <tbody>${recent.map(b => `
                    <tr><td>${esc(b.business_name)}<span class="sub">${esc(b.package_name)} &middot; ${esc(b.couple)}</span></td>
                        <td>${formatDate(b.service_date)}</td>
                        <td class="num">${rupees(b.agreed_amount, 0)}</td>
                        <td class="num">${b.booking_status === 'Cancelled' ? '&mdash;' : rupees(b.balance, 0)}</td>
                        <td><span class="status ${esc(b.booking_status)}">${esc(b.booking_status)}</span></td></tr>`).join('')}
                  </tbody></table></div>`
                : '<p class="state">No bookings yet. Open a ceremony below, choose “Packages” and press “Book”.</p>';

            content.innerHTML = `
                <div class="stats five">
                    ${tile('Weddings', weddings.length)}
                    ${tile('Bookings', active.length)}
                    ${tile('Total booked', rupees(sum(active, 'agreed_amount'), 0))}
                    ${tile('Paid', rupees(sum(active, 'total_paid'), 0))}
                    ${tile('Balance due', rupees(sum(active, 'balance'), 0), 'agreed − paid')}
                </div>
                <div class="report-grid">
                    <section class="report-card">
                        <h2>Upcoming wedding</h2>
                        <div class="report-sql">your next celebration</div>
                        <div class="upcoming">${upcoming}</div>
                    </section>
                    <section class="report-card">
                        <h2>Plan by ceremony</h2>
                        <div class="report-sql">bookings, vendors, packages and reviews</div>
                        <div class="ceremony-list">${ceremonies}</div>
                    </section>
                </div>
                <section class="report-card">
                    <h2>Recent bookings</h2>
                    <div class="report-sql">balance = agreed amount − successful payments</div>
                    ${bookingTable}
                </section>`;
        }

        async function init() {
            const customer = await requireCustomer();   // not signed in -> login.html, admin -> reports.html
            if (!customer) return;
            renderSession(customer);
            loadDashboard(customer);
        }
        init();
    </script>
</body>
</html>
