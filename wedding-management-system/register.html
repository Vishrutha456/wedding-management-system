<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Wedding Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav id="navbar"></nav>

<main>
  <div class="container">
    <div class="auth-wrap" style="max-width: 560px;">
      <div class="card-soft auth-card">
        <h2 class="mb-1">Create your account</h2>
        <p class="text-muted mb-4">Start planning your wedding in minutes.</p>

        <div id="msg"></div>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="fullName">Full name *</label>
            <input type="text" class="form-control" id="fullName" maxlength="60" placeholder="e.g. Priya Sharma">
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" for="email">Email *</label>
              <input type="email" class="form-control" id="email" maxlength="80" placeholder="you@example.com">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label" for="phone">Phone *</label>
              <input type="tel" class="form-control" id="phone" maxlength="15" placeholder="10-digit mobile number">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="address">Address</label>
            <input type="text" class="form-control" id="address" maxlength="150" placeholder="Area, City">
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" for="password">Password *</label>
              <input type="password" class="form-control" id="password" placeholder="At least 6 characters">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label" for="confirm">Confirm password *</label>
              <input type="password" class="form-control" id="confirm">
            </div>
          </div>
          <button type="submit" class="btn btn-maroon w-100 py-2" id="registerBtn">Create account</button>
        </form>

        <p class="text-center mt-3 mb-0 small">Already registered? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
    // Returns an error message, or '' when the form is valid
    function validate(f) {
        if (!f.fullName || !f.email || !f.phone || !f.password) return 'Please fill in all required (*) fields.';
        if (!/^\S+@\S+\.\S+$/.test(f.email))                   return 'Please enter a valid email address.';
        if (!/^[0-9+ -]{7,15}$/.test(f.phone))                 return 'Phone number should contain 7-15 digits.';   // same rule as chk_customer_phone in the database
        if (f.password.length < 6)                             return 'Password must be at least 6 characters.';
        if (f.password !== f.confirm)                          return 'Passwords do not match.';
        return '';
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = {
            fullName: document.getElementById('fullName').value.trim(),
            email:    document.getElementById('email').value.trim().toLowerCase(),
            phone:    document.getElementById('phone').value.trim(),
            address:  document.getElementById('address').value.trim(),
            password: document.getElementById('password').value,
            confirm:  document.getElementById('confirm').value,
        };

        const problem = validate(f);
        if (problem) { showMessage('msg', problem); return; }

        const btn = document.getElementById('registerBtn');
        btn.disabled = true; btn.textContent = 'Creating account...';

        // 1. Supabase Auth creates the login (password is hashed and stored in auth.users).
        // 2. The extra details in "data" are saved as user metadata.
        // 3. Our trigger handle_new_user() (schema.sql) reads that metadata and
        //    INSERTs the matching row into the CUSTOMER table automatically.
        const { data, error } = await db.auth.signUp({
            email: f.email,
            password: f.password,
            options: { data: { full_name: f.fullName, phone: f.phone, address: f.address || null } }
        });

        if (error) {
            const text = /already registered/i.test(error.message)
                ? 'An account with this email already exists. Please log in.'
                : friendlyError(error);
            showMessage('msg', text);
            btn.disabled = false; btn.textContent = 'Create account';
            return;
        }

        if (data.session) {
            // Email confirmation is OFF -> the user is logged in straight away
            location.href = 'customer-dashboard.html';
        } else {
            // Email confirmation is ON -> they must click the link in their inbox first
            document.getElementById('registerForm').reset();
            showMessage('msg', 'Account created! Please check your email and click the confirmation link, then log in.', 'success');
            btn.disabled = false; btn.textContent = 'Create account';
        }
    });

    async function init() {
        if (await getCurrentUser()) { location.href = 'customer-dashboard.html'; return; }
        renderNavbar('register');
    }
    init();
</script>
</body>
</html>
