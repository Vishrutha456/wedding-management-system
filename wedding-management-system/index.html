<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedora | Wedding Timeline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link href="css/wedora.css" rel="stylesheet">
</head>
<body>
    <main class="page">

        <h1 class="tl-title" aria-label="Wedding Timeline">
            <span class="line"><span class="script-cap">W</span><span class="caps">EDDING</span></span>
            <span class="line"><span class="caps">TIMELINE</span></span>
        </h1>

        <p class="tl-subtitle">Your day, beautifully planned</p>
        <div class="lotus" id="lotus"></div>

        <!-- Filled in by js/timeline.js from the EVENTS list in js/events.js -->
        <ul class="timeline" id="timeline"></ul>

        <p class="signature" aria-label="Wedora"><span class="script-cap">W</span>EDORA</p>

    </main>

    <script src="js/icons.js"></script>
    <script src="js/events.js"></script>
    <script src="js/timeline.js"></script>
</body>
</html>
